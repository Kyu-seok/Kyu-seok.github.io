name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the notes card and the Fun card pick up new kyu-rious lessons from graph.json
  # (scripts/kyu-rious-graph.mjs). If the fetch fails the build fails and the last good deploy stays live.
  schedule:
    - cron: '17 21 * * *' # 06:17 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
