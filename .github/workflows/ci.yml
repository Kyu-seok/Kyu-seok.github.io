name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # runs tsc -b first, so this is the typecheck

  gateway:
    uses: ./.github/workflows/gateway-checks.yml
