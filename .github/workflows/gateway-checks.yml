name: Gateway checks

# gofmt, vet, test, shellcheck and the prompt token ceiling for server/. Called by ci.yml (branches, PRs)
# and by deploy-ask.yml, which refuses to deploy a push to main that fails here.
on:
  workflow_call:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck scripts/*.sh spike/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tokenizers==0.21.1
      - run: python3 scripts/check-prompt-tokens.py
