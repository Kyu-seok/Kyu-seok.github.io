name: Deploy ask gateway

# Syncs server/ to the mini PC and restarts the portfolio-ask Compose project.
# Needs the same secrets as CodeBite's deploy: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '!server/README.md'   # rsync on the box excludes spike/, and the README never reaches it
      - '!server/spike/**'
      - '.github/workflows/deploy-ask.yml'
      - '.github/workflows/gateway-checks.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ask
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/gateway-checks.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy server/ to the mini PC
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'server/*'
          target: '~/portfolio-ask-incoming'
          rm: true
          strip_components: 1

      - name: Build and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            # models/ and log/ live only on the box; .env is written by hand there.
            rsync -a --delete --exclude models --exclude log --exclude .env --exclude spike \
              ~/portfolio-ask-incoming/ ~/portfolio-ask/
            cd ~/portfolio-ask
            docker compose up -d --build --remove-orphans
            for i in $(seq 1 40); do
              curl -sf localhost:8090/health | grep -q '"ready":true' && break
              sleep 5
            done
            curl -sf localhost:8090/health | grep -q '"ready":true' || {
              echo "gateway did not become ready" >&2; docker compose logs --tail 50 gateway; exit 1; }
            echo ready
            # Smoke: one real question must stream and land in the question log.
            MARK="deploy smoke ${{ github.run_id }}"
            curl -sN -m 60 -H 'Content-Type: application/json' \
              -d "{\"question\":\"$MARK: which editor do you use?\",\"lang\":\"en\",\"intent\":\"skills\"}" \
              localhost:8090/ask | grep -q '"outcome":"ok"' || { echo "smoke question failed" >&2; exit 1; }
            tail -n 1 log/questions-*.jsonl | grep -qF "$MARK" || { echo "smoke question not in the log" >&2; exit 1; }
            echo "smoke ok"
