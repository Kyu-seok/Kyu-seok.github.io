<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korean Picker Prototype</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#e7e5e4;--card:#fff;--ok:#15803d;--bad:#b91c1c;--warn:#a16207;--accent:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#44403c;--card:#292524;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--accent:#93c5fd}}
:root[data-theme="dark"]{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#44403c;--card:#292524;--ok:#4ade80;--bad:#f87171;--warn:#facc15;--accent:#93c5fd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.banner{border:1px dashed var(--warn);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:none;border:1px solid var(--line);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:8px}input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button.go{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.id{font-family:ui-monospace,monospace;font-weight:600;color:var(--accent)}.m{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.ok{color:var(--ok)}.bad{color:var(--bad)}.score{font-size:18px;font-weight:600}
pre{white-space:pre-wrap;font-size:12px;color:var(--muted);max-height:420px;overflow:auto}
.hist .box{margin-top:8px}.wrap{overflow-x:auto}
</style></head><body><main>
<div class="banner">PROTOTYPE, throwaway. It judges only which id the model <b>picks</b>. Reply text is Claude's rough draft, not Kyu's voice.</div>
<h1>Korean picker</h1>
<p class="sub">Qwen3-1.7B on the mini PC is allowed to output only one bank id. Type something a visitor might type.</p>
<div class="tabs"><button data-t="try" class="on">Try it</button><button data-t="bench">Run the 28 tests</button><button data-t="bank">Bank and prompt</button></div>

<section id="try">
  <form id="f"><input id="q" autocomplete="off" placeholder="예: 심심해, 에디터 뭐 써요?, 그중 하나만 알려줘" autofocus><button class="go">Pick</button></form>
  <div class="hist" id="hist"></div>
</section>
<section id="bench" hidden>
  <button class="go" id="run">Run all</button> <span class="m" id="prog"></span>
  <div class="box"><span class="score" id="score">–</span> <span class="m" id="detail"></span></div>
  <div class="wrap"><table><thead><tr><th>#</th><th>Question</th><th>Picked</th><th>Accepted</th><th>ms</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<section id="bank" hidden><div id="bankview"></div><h3>System prompt sent to the model</h3><pre id="prompt"></pre></section>
</main>
<script>
const $=s=>document.querySelector(s);let state;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['try','bench','bank'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t)});
async function load(){state=await (await fetch('/state')).json();
  $('#prompt').textContent=state.prompt;
  $('#bankview').innerHTML=state.bank.map(e=>`<div class="box"><span class="id">${esc(e.id)}</span> <span class="m">${esc(e.card)}</span><div class="m">${e.examples.map(esc).join(' · ')}</div><div>${esc(e.reply)}</div></div>`).join('');}
async function pick(q){const r=await fetch('/pick',{method:'POST',body:JSON.stringify({q})});return r.json();}
$('#f').onsubmit=async ev=>{ev.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';
  const el=document.createElement('div');el.className='box';el.innerHTML=`<div><b>${esc(q)}</b> <span class="m">picking…</span></div>`;$('#hist').prepend(el);
  const r=await pick(q);
  el.innerHTML=r.error?`<div><b>${esc(q)}</b></div><div class="bad">${esc(r.error)}</div>`:
   `<div><b>${esc(q)}</b> → <span class="id">${esc(r.id)}</span> <span class="m">${esc(r.card)}</span></div><div>${esc(r.reply)}</div>
    <div class="m">${r.wall_ms} ms total · read ${r.prompt_n} tokens in ${r.prompt_ms} ms · wrote ${r.predicted_n} tokens in ${r.predicted_ms} ms</div>`;};
$('#run').onclick=async()=>{const rows=$('#rows');rows.innerHTML='';let pass=0,traps=0,trapOk=0,ms=[];
  for(const [i,t] of state.tests.entries()){$('#prog').textContent=`${i+1} / ${state.tests.length}`;
    const r=await pick(t.q);const ok=!r.error&&t.ok.includes(r.id);if(ok)pass++;if(t.trap){traps++;if(ok)trapOk++;}if(!r.error)ms.push(r.wall_ms);
    rows.insertAdjacentHTML('beforeend',`<tr><td>${i+1}</td><td>${esc(t.q)}${t.trap?' <span class="m">trap</span>':''} <span class="m">${t.src}</span></td><td class="${ok?'ok':'bad'}">${ok?'✓':'✗'} <span class="id">${esc(r.id||r.error)}</span></td><td class="m">${t.ok.join(', ')}</td><td>${r.wall_ms??''}</td></tr>`);}
  ms.sort((a,b)=>a-b);const p50=ms[Math.floor(ms.length/2)],max=ms[ms.length-1];
  $('#prog').textContent='done';$('#score').innerHTML=`<span class="${pass>=24&&trapOk===traps?'ok':'bad'}">${pass} / ${state.tests.length}</span>`;
  $('#detail').textContent=`traps ${trapOk}/${traps} · total p50 ${p50} ms, max ${max} ms · pass line: ≥24, all traps, p50 < 2000 ms`;};
load();
</script></body></html>
