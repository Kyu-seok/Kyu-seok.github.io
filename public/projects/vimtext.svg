  <text x="340" y="621" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#d7dde8">ci"  ·  dap  ·  ysiw)  ·  /spike</text>
  <text x="1050" y="621" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#8b95a5" text-anchor="end">3:19</text>
