<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="VimText: a web textarea in Vim normal mode">
  <!-- Authored cover for VimText (no screenshot exists). -->
  <rect width="1200" height="750" fill="#15181d"/>
  <rect x="120" y="110" width="960" height="530" rx="22" fill="#1e232b" stroke="#2c333d" stroke-width="2"/>
  <rect x="120" y="110" width="960" height="56" rx="22" fill="#262c36"/>
  <circle cx="160" cy="138" r="8" fill="#ff5f57"/><circle cx="186" cy="138" r="8" fill="#febc2e"/><circle cx="212" cy="138" r="8" fill="#28c840"/>
  <text x="600" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b95a5" text-anchor="middle">&lt;textarea&gt; on any website</text>
